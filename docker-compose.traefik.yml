# Infraestructura: Traefik (API Gateway / reverse proxy).
# Se conecta a la red compartida externa y descubre los servicios vía Consul Catalog.
# Proyecto aislado: evita que `docker compose up` de otra ficha lo trate como
# "huérfano" y borre el contenedor (todas las fichas comparten la red externa).
# Phase 6: Service discovery via Consul Catalog provider (no Docker labels).
name: pdf-extractext-gateway

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"        # entrypoint web (tráfico de la API)
      - "8080:8080"    # dashboard/api (solo desarrollo)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-test_network}
    external: true