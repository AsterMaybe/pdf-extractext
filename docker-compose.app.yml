# Aplicación FastAPI — conectada al gateway Traefik via Consul Catalog.
# No publica puertos: todo el tráfico entra por Traefik (expose queda interno).
# Proyecto aislado: evita que `docker compose up` de esta ficha borre los
# contenedores de las otras fichas (db/gateway) como "huérfanos".
# Todas las fichas se conectan por la red externa compartida.
# Service discovery via Consul Catalog (Phase 6) - no Traefik labels needed.
name: pdf-extractext-app

services:
  myapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:v1.0.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    expose:
      - "8000"
    environment:
      - TZ=${TZ:-UTC}
      - PDF_MAX_SIZE_MB=${PDF_MAX_SIZE_MB:-25}
      - PDF_EXTRACT_SERVICE_URL=${PDF_EXTRACT_SERVICE_URL:-http://microservicio-go:8080}
      - DB_SERVICE_URL=${DB_SERVICE_URL:-http://microservicio-db:8080}
      - DB_SERVICE_TIMEOUT_SECONDS=${DB_SERVICE_TIMEOUT_SECONDS:-10.0}
      # Opcional: el default de la app ya incluye api.localhost.
      # - ALLOWED_HOSTS=["api.localhost","localhost","127.0.0.1"]
      # Consul registration (via local client agent for Connect sidecar support)
      - CONSUL_HTTP_ADDR=${CONSUL_HTTP_ADDR:-consul-agent-monolitico:8500}
      - CONSUL_HTTP_TOKEN=${CONSUL_HTTP_TOKEN:-}
      # Consul Service Discovery
      - CONSUL_DNS_PORT=${CONSUL_DNS_PORT:-8600}
      - CONSUL_DISCOVERY_CACHE_TTL=${CONSUL_DISCOVERY_CACHE_TTL:-30}
      # Connect sidecar ports for mTLS
      - CONNECT_SIDECAR_PORT_GO=${CONNECT_SIDECAR_PORT_GO:-8443}
      - CONNECT_SIDECAR_PORT_DB=${CONNECT_SIDECAR_PORT_DB:-8444}
      # Traefik routing via Consul tags (Phase 6)
      - DOMAIN_HOST=${DOMAIN_HOST:-api.localhost}
    # Healthcheck de Docker: el contenedor se marca unhealthy si el servicio no
    # responde localmente (independiente del gateway).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shared-network

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-test_network}
    external: true