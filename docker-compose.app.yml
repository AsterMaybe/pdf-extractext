# Aplicación FastAPI — conectada al gateway Traefik via Consul Catalog.
# No publica puertos: todo el tráfico entra por Traefik (expose queda interno).
# Proyecto aislado: evita que `docker compose up` de esta ficha borre los
# contenedores de las otras fichas (db/gateway) como "huérfanos".
# Todas las fichas se conectan por la red externa compartida.
# Service discovery via Consul Catalog (Phase 6) - no Traefik labels needed.
name: pdf-extractext-app

services:
  myapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:v1.0.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    expose:
      - "8000"
    environment:
      - TZ=${TZ:-UTC}
      - PDF_MAX_SIZE_MB=${PDF_MAX_SIZE_MB:-25}
      - PDF_EXTRACT_SERVICE_URL=${PDF_EXTRACT_SERVICE_URL:-http://microservicio-go:8080}
      - DB_SERVICE_URL=${DB_SERVICE_URL:-http://microservicio-db:8080}
      - DB_SERVICE_TIMEOUT_SECONDS=${DB_SERVICE_TIMEOUT_SECONDS:-10.0}
      # Opcional: el default de la app ya incluye api.localhost.
      # - ALLOWED_HOSTS=["api.localhost","localhost","127.0.0.1"]
      # Consul registration (via local client agent for Connect sidecar support)
      - CONSUL_HTTP_ADDR=${CONSUL_HTTP_ADDR:-consul-agent-monolitico:8500}
      - CONSUL_HTTP_TOKEN=${CONSUL_HTTP_TOKEN:-}
      # Consul Service Discovery
      - CONSUL_DNS_PORT=${CONSUL_DNS_PORT:-8600}
      - CONSUL_DISCOVERY_CACHE_TTL=${CONSUL_DISCOVERY_CACHE_TTL:-30}
      # Connect sidecar ports for mTLS
      - CONNECT_SIDECAR_PORT_GO=${CONNECT_SIDECAR_PORT_GO:-8443}
      - CONNECT_SIDECAR_PORT_DB=${CONNECT_SIDECAR_PORT_DB:-8444}
      # Traefik routing via Consul tags (Phase 6)
      - DOMAIN_HOST=${DOMAIN_HOST:-api.localhost}
    # Healthcheck de Docker: el contenedor se marca unhealthy si el servicio no
    # responde localmente (independiente del gateway).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""] 
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shared-network

  microservicio-resume:
    build:
      context: ./microservicio-resume
      dockerfile: Dockerfile
    image: microservicio-resume:v1.0.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    expose:
      - "8080"
    environment:
      - APP_NAME=microservicio-resume
      - APP_VERSION=0.1.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8080
      - TZ=${TZ:-America/Argentina/Buenos_Aires}

      # ── Kafka ──
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_TOPIC_VALIDATED=${KAFKA_TOPIC_VALIDATED:-pdf.validated}
      - KAFKA_TOPIC_COMPLETED=${KAFKA_TOPIC_COMPLETED:-summary.completed}
      - KAFKA_TOPIC_DLQ=${KAFKA_TOPIC_DLQ:-summary.dlq}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-resume-worker}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-microservicio-resume}

      # ── IA (OpenAI-compatible) ──
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-500}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.3}
      - AI_TIMEOUT=${AI_TIMEOUT:-30s}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_BACKOFF_BASE=${AI_BACKOFF_BASE:-1s}

      # ── Persistencia vía HTTP al microservicio-db-go ──
      - DB_SERVICE_URL=${DB_SERVICE_URL:-http://microservicio-db:8080}
      - DB_SERVICE_TIMEOUT=${DB_SERVICE_TIMEOUT:-10s}
      - DB_WAIT_TIMEOUT=${DB_WAIT_TIMEOUT:-2m}
      - DB_WAIT_INTERVAL=${DB_WAIT_INTERVAL:-1s}

      # ── RFC 9457 ──
      - ERR_BASE_URL=${ERR_BASE_URL:-https://errors.example.com}
    # Healthcheck de Docker (solo liveness interna)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-test_network}
    external: true