# Aplicación FastAPI — conectada al gateway Traefik vía labels.
# No publica puertos: todo el tráfico entra por Traefik (expose queda interno).
# Proyecto aislado: evita que `docker compose up` de esta ficha borre los
# contenedores de las otras fichas (db/gateway) como "huérfanos".
# Todas las fichas se conectan por la red externa compartida.
name: pdf-extractext-app

services:
  myapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:v1.0.0
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      - MONGODB_DB_NAME=${MONGODB_DB_NAME}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION}
      - TZ=${TZ:-UTC}
      # Opcional: el default de la app ya incluye api.localhost.
      # - ALLOWED_HOSTS=["api.localhost","localhost","127.0.0.1"]
    labels:
      - "traefik.enable=true"
      # Red que Traefik debe usar para alcanzar este contenedor (la interpola compose).
      - "traefik.docker.network=${SHARED_NETWORK_NAME:-default-shared-network}"
      # Router HTTP
      - "traefik.http.routers.pdf-app.rule=Host(`${DOMAIN_HOST:-api.localhost}`)"
      - "traefik.http.routers.pdf-app.entrypoints=web"
      - "traefik.http.routers.pdf-app.service=pdf-app"
      # Servicio, puerto interno y estrategia de balanceo
      - "traefik.http.services.pdf-app.loadbalancer.server.port=8000"
      # Sin healthcheck activo en Traefik: probea con la IP del contenedor y
      # TrustedHostMiddleware de la app la rechaza (400). La liveness real la
      # cubre el healthcheck DOCKER de abajo (127.0.0.1).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shared-network

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-default-shared-network}
    external: true