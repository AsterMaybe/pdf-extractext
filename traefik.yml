# Traefik — Configuración estática (install configuration).
# Fase actual: HTTP-only (entrypoint `web`). TLS/Let's Encrypt queda documentado
# como bloque comentado más abajo para el paso a HTTPS.
# Service discovery via Consul Catalog provider (Phase 6).

api:
  dashboard: true
  # SOLO para local/staging. En producción: dashboard protegido con middleware
  # BasicAuth o desactivado (insecure: false).
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  # Docker provider: only for Traefik's own management (labels on traefik container)
  # Service discovery is handled by Consul Catalog provider below
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  
  # Consul Catalog provider: discovers services registered in Consul
  # Services must be tagged with "traefik.enable=true" in Consul
  consulCatalog:
    endpoint:
      address: "consul:8500"
      # Token for Consul ACL (optional, for dev mode)
      token: "dev-bootstrap-token"
    # prefix: "traefik"  -- removed to test if it filters service discovery
    # Only register services with this tag
    requireConsistent: false
    # Cache catalog to reduce Consul API calls -- DISABLED to test monolitico discovery
    cache: false
    # Use stale reads for better performance -- DISABLED to test monolitico discovery
    stale: false
    # Create default router for services without explicit traefik tags
    defaultRule: "Host(`{{ .Name }}.localhost`)"

metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: DEBUG

