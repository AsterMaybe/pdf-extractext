# Proyecto aislado: evita que `docker compose up` de otra ficha lo trate como
# "huérfano" y borre el contenedor (todas las fichas comparten la red externa).
name: pdf-extractext-db

services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - mongo_data:/data/db
    networks:
      - shared-network

volumes:
  mongo_data:
    # Volumen externo con nombre fijo: conserva los datos entre proyectos/fichas.
    name: pdf-extractext_mongo_data
    external: true

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-default-shared-network}
    external: true