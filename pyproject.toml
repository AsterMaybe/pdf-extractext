[project]
name = "pdf-extractext"
version = "0.1.0"
description = "API para extraer texto de PDFs y persistirlo en MongoDB."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.3",
    "motor==3.7.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pymupdf4llm==1.27.2.2",
    "python-multipart==0.0.24",
    "uvicorn==0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.1.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.1.0",
    "httpx==0.28.1",
]
