services:
  myapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:v1.0.0
    ports:
      - '8000:8000'
    environment:
      - MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      - MONGODB_DB_NAME=${MONGO_NAME}
      - MONGODB_COLLECTION=${MONGO_COLLECTION}
    networks:
      - shared-network

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-default-shared-network}
    external: true